<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="100%" stop-color="#0D162C"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
  </defs>

  <rect width="800" height="620" rx="16" fill="#060A16"/>

  <!-- Left Phone (Front) -->
  <g transform="translate(140, 40)">
    <!-- Outer Body -->
    <rect width="250" height="520" rx="40" fill="#0C1222" stroke="#334155" stroke-width="3"/>
    <!-- Inner Screen -->
    <rect x="10" y="10" width="230" height="500" rx="32" fill="url(#screenGrad)"/>
    
    <!-- Dynamic Island / Notch -->
    <rect x="80" y="20" width="90" height="22" rx="11" fill="#000000"/>
    <circle cx="95" cy="31" r="4" fill="#1E293B"/>

    <!-- App Content -->
    <!-- Top Bar -->
    <text x="25" y="75" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748B">KRAD CORE MOBILE</text>
    <circle cx="210" cy="71" r="5" fill="#10B981"/>

    <!-- Card 1: Biometric Wallet -->
    <rect x="20" y="95" width="210" height="110" rx="16" fill="#1E293B" fill-opacity="0.6" stroke="#00D2FE" stroke-opacity="0.3" stroke-width="1"/>
    <text x="35" y="125" font-family="sans-serif" font-size="11" fill="#94A3B8">Encrypted Balance</text>
    <text x="35" y="160" font-family="sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">$48,290.00</text>
    <text x="35" y="185" font-family="monospace" font-size="10" fill="#34D399">▲ FaceID Verified • Sub-5ms</text>

    <!-- Quick Actions -->
    <rect x="20" y="220" width="45" height="45" rx="12" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
    <text x="35" y="247" font-family="sans-serif" font-size="12" fill="#00D2FE">↗</text>
    <rect x="75" y="220" width="45" height="45" rx="12" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
    <text x="90" y="247" font-family="sans-serif" font-size="12" fill="#34D399">↙</text>
    <rect x="130" y="220" width="45" height="45" rx="12" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
    <text x="145" y="247" font-family="sans-serif" font-size="12" fill="#818CF8">⚡</text>
    <rect x="185" y="220" width="45" height="45" rx="12" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
    <text x="200" y="247" font-family="sans-serif" font-size="12" fill="#F59E0B">⚙</text>

    <!-- Feed List -->
    <text x="25" y="295" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Real-time Transaction Stream</text>
    
    <rect x="20" y="310" width="210" height="50" rx="12" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
    <text x="35" y="332" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Cloud API Payout</text>
    <text x="35" y="348" font-family="monospace" font-size="9" fill="#64748B">Instant Settlement</text>
    <text x="175" y="338" font-family="sans-serif" font-size="11" font-weight="700" fill="#34D399">+$2,450</text>

    <rect x="20" y="370" width="210" height="50" rx="12" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
    <text x="35" y="392" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Vector Query Index</text>
    <text x="35" y="408" font-family="monospace" font-size="9" fill="#64748B">Automated RAG</text>
    <text x="185" y="398" font-family="sans-serif" font-size="11" font-weight="700" fill="#94A3B8">-$48</text>

    <rect x="20" y="430" width="210" height="50" rx="12" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
    <text x="35" y="452" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Enterprise SLA</text>
    <text x="35" y="468" font-family="monospace" font-size="9" fill="#64748B">Active Tier 1</text>
    <text x="165" y="458" font-family="sans-serif" font-size="11" font-weight="700" fill="#00D2FE">Verified</text>

    <!-- Bottom Home Indicator -->
    <rect x="85" y="495" width="80" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- Right Phone (Angled / Offset) -->
  <g transform="translate(430, 70)">
    <rect width="230" height="470" rx="36" fill="#090E1D" stroke="#1E293B" stroke-width="2"/>
    <rect x="8" y="8" width="214" height="454" rx="28" fill="url(#screenGrad)"/>
    <rect x="75" y="16" width="80" height="18" rx="9" fill="#000000"/>

    <text x="25" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Offline Queue Sync</text>
    <rect x="20" y="80" width="190" height="80" rx="12" fill="#1E293B" fill-opacity="0.5"/>
    <text x="32" y="105" font-family="monospace" font-size="10" fill="#38BDF8">SQLite Local Cache: OK</text>
    <text x="32" y="125" font-family="monospace" font-size="10" fill="#34D399">Background Sync: Idle</text>
    <text x="32" y="145" font-family="monospace" font-size="10" fill="#94A3B8">Push Tokens: Registered</text>

    <!-- Telemetry Graph -->
    <rect x="20" y="175" width="190" height="140" rx="12" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
    <text x="32" y="200" font-family="sans-serif" font-size="10" font-weight="600" fill="#94A3B8">60 FPS Native Render</text>
    <polyline points="32,280 60,260 85,270 110,240 140,250 170,220 195,225" fill="none" stroke="#00D2FE" stroke-width="2"/>

    <rect x="20" y="330" width="190" height="70" rx="12" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
    <text x="32" y="355" font-family="sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Cross-Platform</text>
    <text x="32" y="375" font-family="monospace" font-size="9" fill="#34D399">Flutter + React Native 0.76</text>
    <text x="32" y="390" font-family="monospace" font-size="9" fill="#64748B">Single Codebase / Native Speed</text>
  </g>
</svg>
