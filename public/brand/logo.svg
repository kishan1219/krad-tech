<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan glow gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <!-- Silver metallic gradient -->
    <linearGradient id="silverBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- K with cybernetic circuit lines -->
  <g id="letter-K">
    <path d="M 30 18 L 48 18 L 48 85 L 30 85 Z" fill="url(#silverBevel)" />
    <!-- Glowing circuit accents on K -->
    <path d="M 33 22 L 40 22 L 40 45 L 33 45 Z" fill="#00D2FE" filter="url(#glowFilter)" opacity="0.85" />
    <path d="M 48 44 L 84 18 L 105 18 L 65 52 L 106 85 L 84 85 L 53 58 L 48 63 L 48 85 Z" fill="url(#silverBevel)" />
    <path d="M 82 24 L 62 42 L 67 48 L 88 29 Z" fill="#00D2FE" filter="url(#glowFilter)" opacity="0.6" />
  </g>

  <!-- R sleek and beveled -->
  <g id="letter-R">
    <path d="M 118 18 L 158 18 C 176 18 188 27 188 42 C 188 54 179 62 165 65 L 192 85 L 168 85 L 145 67 L 137 67 L 137 85 L 118 85 Z M 137 34 L 137 52 L 156 52 C 165 52 170 48 170 43 C 170 38 165 34 156 34 Z" fill="url(#silverBevel)" />
  </g>

  <!-- A with illuminated cyan diamond chevron core -->
  <g id="letter-A">
    <path d="M 225 18 L 246 18 L 278 85 L 257 85 L 250 69 L 221 69 L 214 85 L 193 85 Z M 227 54 L 244 54 L 235.5 35 Z" fill="url(#silverBevel)" />
    <!-- Glowing cyan chevron inside A -->
    <polygon points="235.5,38 245,55 235.5,50 226,55" fill="#00D2FE" filter="url(#glowFilter)" />
    <circle cx="235.5" cy="46" r="3" fill="#FFFFFF" filter="url(#glowFilter)" />
  </g>

  <!-- D modern sleek sans -->
  <g id="letter-D">
    <path d="M 288 18 L 322 18 C 347 18 362 31 362 51.5 C 362 72 347 85 L 288 85 Z M 307 34 L 307 69 L 321 69 C 336 69 344 62 344 51.5 C 344 41 336 34 321 34 Z" fill="url(#silverBevel)" />
  </g>

  <!-- TECHNOLOGY in futuristic cyan -->
  <text x="382" y="80" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="4" fill="#00D2FE">TECHNOLOGY</text>

  <!-- Tagline underneath matching official brand -->
  <text x="30" y="118" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" letter-spacing="1.5" fill="#94A3B8">
    WhatsApp Business API <tspan fill="#00D2FE" font-weight="700">|</tspan> AI Chatbots <tspan fill="#00D2FE" font-weight="700">|</tspan> Automation <tspan fill="#00D2FE" font-weight="700">|</tspan> AI Voice
  </text>
</svg>
