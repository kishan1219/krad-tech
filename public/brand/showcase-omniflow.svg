  <rect x="425" y="475" width="705" height="210" rx="14" fill="#060A16" stroke="#1E293B" stroke-width="1"/>
  <text x="445" y="505" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Vector Retrieval Telemetry &amp; Guardrail Verification</text>

  <rect x="445" y="525" width="210" height="140" rx="10" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
  <text x="460" y="550" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Top Retrieved Chunk</text>
  <text x="460" y="575" font-family="monospace" font-size="10" fill="#00D2FE">doc_id: srv_enterprise_sla</text>
  <text x="460" y="595" font-family="monospace" font-size="10" fill="#64748B">Cosine Score: <tspan fill="#34D399" font-weight="700">0.9642</tspan></text>
  <text x="460" y="615" font-family="monospace" font-size="10" fill="#64748B">Namespace: /legal/sla</text>
  <text x="460" y="640" font-family="monospace" font-size="9" fill="#38BDF8">Status: Verified Cache</text>

  <rect x="670" y="525" width="220" height="140" rx="10" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
  <text x="685" y="550" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Hallucination Guardrail</text>
  <text x="685" y="575" font-family="monospace" font-size="10" fill="#34D399">P(Groundedness) = 0.998</text>
  <text x="685" y="595" font-family="monospace" font-size="10" fill="#64748B">Context Token Count: 1,840</text>
  <text x="685" y="615" font-family="monospace" font-size="10" fill="#64748B">Safety Filter: 0 violations</text>
  <text x="685" y="640" font-family="monospace" font-size="9" fill="#34D399">Audit Result: APPROVED</text>

  <rect x="905" y="525" width="205" height="140" rx="10" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
  <text x="920" y="550" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Client Roundtrip Speed</text>
  <text x="920" y="585" font-family="sans-serif" font-size="28" font-weight="800" fill="#00D2FE">372ms</text>
  <text x="920" y="610" font-family="monospace" font-size="10" fill="#34D399">Sub-400ms P95 Target Met</text>
  <text x="920" y="635" font-family="monospace" font-size="9" fill="#64748B">End-to-End Meta API ACK</text>
