  </text>
  <rect x="1000" y="55" width="130" height="26" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1"/>
  <circle cx="1015" cy="68" r="4" fill="#10B981"/>
  <text x="1027" y="72" font-family="monospace" font-size="11" font-weight="700" fill="#34D399">ROUTING ACTIVE</text>

