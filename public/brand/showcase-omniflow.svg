  <!-- Message Item 1 -->
  <rect x="80" y="185" width="310" height="95" rx="10" fill="#0C1326" stroke="#00D2FE" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="102" cy="208" r="8" fill="#25D366" fill-opacity="0.2"/>
  <text x="98" y="212" font-family="monospace" font-size="10" fill="#25D366">W</text>
  <text x="120" y="210" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">+91 98765 *****</text>
  <text x="310" y="210" font-family="monospace" font-size="10" fill="#00D2FE">32ms</text>
  <text x="95" y="235" font-family="sans-serif" font-size="11" fill="#94A3B8">"Need enterprise tier pricing for 50k"</text>
  <rect x="95" y="248" width="85" height="18" rx="4" fill="#00D2FE" fill-opacity="0.1"/>
  <text x="102" y="261" font-family="monospace" font-size="9" fill="#00D2FE">Intent: Pricing</text>
  <rect x="188" y="248" width="70" height="18" rx="4" fill="#10B981" fill-opacity="0.1"/>
  <text x="195" y="261" font-family="monospace" font-size="9" fill="#34D399">Conf: 0.99</text>

  <!-- Message Item 2 -->
  <rect x="80" y="295" width="310" height="95" rx="10" fill="#0C1326" stroke="#1E293B" stroke-width="1"/>
  <circle cx="102" cy="318" r="8" fill="#25D366" fill-opacity="0.2"/>
  <text x="98" y="322" font-family="monospace" font-size="10" fill="#25D366">W</text>
  <text x="120" y="320" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">+44 7911 *****</text>
  <text x="310" y="320" font-family="monospace" font-size="10" fill="#00D2FE">41ms</text>
  <text x="95" y="345" font-family="sans-serif" font-size="11" fill="#94A3B8">"Schedule technical architecture demo"</text>
  <rect x="95" y="358" width="95" height="18" rx="4" fill="#818CF8" fill-opacity="0.1"/>
  <text x="102" y="371" font-family="monospace" font-size="9" fill="#818CF8">Intent: DemoBook</text>

  <!-- Message Item 3 -->
