  <text x="95" y="625" font-family="monospace" font-size="11" fill="#94A3B8">Mean Response Latency: <tspan fill="#38BDF8" font-weight="700">380ms</tspan></text>
  <text x="95" y="650" font-family="monospace" font-size="11" fill="#94A3B8">HMAC Signature Failures: <tspan fill="#EF4444" font-weight="700">0 (100% Verified)</tspan></text>

