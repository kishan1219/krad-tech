  <text x="910" y="200" font-family="monospace" font-size="9" fill="#64748B">CRM Synchronized</text>

  <!-- Node: Tech Agent -->
  <rect x="890" y="220" width="150" height="50" rx="8" fill="#0C1326" stroke="#38BDF8" stroke-width="1"/>
  <text x="910" y="245" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">RAG Knowledge</text>
  <text x="910" y="260" font-family="monospace" font-size="9" fill="#64748B">Pinecone 1536-dim</text>

  <!-- Node: Booking Agent -->
  <rect x="890" y="280" width="150" height="50" rx="8" fill="#0C1326" stroke="#C084FC" stroke-width="1"/>
