<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="iconBlur">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark background container with rounded corner -->
  <rect width="64" height="64" rx="14" fill="#0A0F1D" stroke="#00D2FE" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Cybernetic Chevron / A-core geometry -->
  <polygon points="32,12 50,48 41,48 32,28 23,48 14,48" fill="#F8FAFC" />
  <!-- Neon cyan diamond core -->
  <polygon points="32,26 40,42 32,38 24,42" fill="url(#iconGlow)" filter="url(#iconBlur)" />
  <circle cx="32" cy="34" r="2.5" fill="#FFFFFF" />
  <!-- Tech trace -->
  <circle cx="50" cy="48" r="1.5" fill="#00D2FE" />
  <circle cx="14" cy="48" r="1.5" fill="#00D2FE" />
</svg>
