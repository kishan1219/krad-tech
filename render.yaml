# ==============================================================================
# Render Blueprint Specification for KRAD Technology
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: krad-tech
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://krad-tech.onrender.com
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        value: contact@kradtechnology.com
      - key: NEXT_PUBLIC_CONTACT_PHONE
        value: "+91 91110 21438"
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        value: "919111021438"
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
